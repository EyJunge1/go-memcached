version: "2"

linters:
  default: standard
  enable:
    - revive
    - gosec
  disable:
    - unused
    - staticcheck
  settings:
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: var-naming
          disabled: true
  exclusions:
    rules:
      - linters:
          - revive
        text: "var-naming: avoid package names that conflict with Go standard library"
      - linters:
          - revive
        text: "could remove embedded field.*Mutex"

formatters:
  enable:
    - gofumpt

run:
  timeout: 5m
