version: "2"

linters:
  default: standard
  enable:
    - revive
    - gosec
    - unused
    - staticcheck
  settings:
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: var-naming
          disabled: true
    staticcheck:
      checks:
        - all
        - "-QF1008"
  exclusions:
    rules:
      - linters:
          - revive
        text: "var-naming: avoid package names that conflict with Go standard library"
      - path: _test\.go
        linters:
          - gosec
      - path: _test\.go
        linters:
          - revive
        text: "context-as-argument"

formatters:
  enable:
    - gofumpt

run:
  timeout: 5m
