name: Release

on:
  push:
    tags:
      - "memcached/v*"
      - "memcachedotel/v*"

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      module: ${{ steps.parse.outputs.module }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag="${GITHUB_REF_NAME}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          if [[ "$tag" =~ ^memcached/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            module=memcached
            ver="${BASH_REMATCH[1]}"
          elif [[ "$tag" =~ ^memcachedotel/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            module=memcachedotel
            ver="${BASH_REMATCH[1]}"
          else
            echo "Unsupported release tag: $tag"
            echo "Expected memcached/vX.Y.Z or memcachedotel/vX.Y.Z"
            exit 1
          fi

          if [[ "$module" == "memcachedotel" ]]; then
            # Nested modules must depend on a real published core tag (replace is local-only).
            req="$(awk '/^require \(/{p=1;next} /^)/{p=0} p && /github\.com\/EyJunge1\/go-memcached\/memcached /{print $2; exit}' memcachedotel/go.mod)"
            if [[ -z "$req" ]]; then
              req="$(awk '/^require github\.com\/EyJunge1\/go-memcached\/memcached /{print $2; exit}' memcachedotel/go.mod)"
            fi
            if [[ ! "$req" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "memcachedotel/go.mod must require a SemVer core tag before memcachedotel release (got: ${req:-empty})"
              echo "Bump require to e.g. v${ver} (or the current core release), keep replace => ../memcached for local CI."
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/memcached/${req}" >/dev/null; then
              echo "Core tag memcached/${req} (required by memcachedotel/go.mod) does not exist yet"
              echo "Tag and release the core module first, then tag memcachedotel/v…"
              exit 1
            fi
          fi

          echo "module=${module}" >>"$GITHUB_OUTPUT"
          echo "version=${ver}" >>"$GITHUB_OUTPUT"
          echo "Validated ${tag} (${module} ${ver})"

  release:
    name: GitHub Release
    needs: [validate-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODULE: ${{ needs.validate-tag.outputs.module }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          latest_args=(--latest=false)
          # Only core SemVer tags compete for GitHub "latest".
          if [[ "$MODULE" == "memcached" ]]; then
            latest_args=(--latest)
            mapfile -t tags < <(git tag -l 'memcached/v*.*.*' | grep -E '^memcached/v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's|^memcached/v||' | sort -V)
            if [[ ${#tags[@]} -gt 0 ]]; then
              highest="memcached/v${tags[-1]}"
              if [[ "$tag" != "$highest" ]]; then
                latest_args=(--latest=false)
              fi
            fi
          fi
          title="$tag"
          if [[ "$MODULE" == "memcached" ]]; then
            title="memcached ${tag#memcached/}"
          elif [[ "$MODULE" == "memcachedotel" ]]; then
            title="memcachedotel ${tag#memcachedotel/}"
          fi
          gh release create "$tag" \
            --title "$title" \
            --generate-notes \
            --verify-tag \
            "${latest_args[@]}"
