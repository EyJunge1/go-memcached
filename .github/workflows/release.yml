name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $tag (expected vX.Y.Z)"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          ver="${tag#v}"
          if ! grep -qF "## [${ver}]" CHANGELOG.md; then
            echo "CHANGELOG.md missing section ## [${ver}]"
            exit 1
          fi

  check:
    name: Pre-release checks
    needs: validate-tag
    uses: ./.github/workflows/check.yml

  release:
    name: GitHub Release
    needs: [validate-tag, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          latest_args=(--latest)
          # Only mark as GitHub "latest" when this tag is the highest SemVer tag.
          mapfile -t tags < <(git tag -l 'v*.*.*' | sed 's/^v//' | sort -V)
          highest="v${tags[-1]}"
          if [[ "$tag" != "$highest" ]]; then
            latest_args=(--latest=false)
          fi
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --verify-tag \
            "${latest_args[@]}"
