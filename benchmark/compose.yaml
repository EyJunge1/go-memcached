# Lives in this module, not the library root.
# From repo root: make live-up / make bench-compare
# Image pin via MEMCACHED_IMAGE (default 1.6.42). TCP and UDP on 11211.
name: gomemcached-bench

services:
  mc:
    image: memcached:${MEMCACHED_IMAGE:-1.6.42}
    command: ["memcached", "-p", "11211", "-U", "11211", "-m", "64"]
    ports:
      - "11211:11211"
      - "11211:11211/udp"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/11211'"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
